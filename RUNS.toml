[[entry]]
match = "levels/values/*@500k"
note = """
One dataset per point of the two-objective sweeps. Values are drawn at
generation and stored per level, so sweeping them needs one dataset each.
FixedValues consumes no randomness, so every dataset here shares its layouts and
differs only in what the objectives pay — verified: all eight layout arrays,
split membership included, are byte-identical across the grid.
"""

[[entry]]
match = "levels/values/1.00-0.65-0.30@1M"
note = "1M levels at (1.0, 0.65, 0.3), for training the three-objective base agent."

[[entry]]
match = "levels/values/*@150k"
note = """
Arm datasets for the three-objective grids, 150k levels each. Far smaller than
the base dataset because the arms are far shorter runs: 1M steps is about 100k
episodes, so 140k training levels is already more than one apiece. Three
objectives cost 1.75 ms a level against 0.42 for two, so 500k-level arms would
have put nearly three hours of generation in front of the training run.
"""

[[entry]]
match = "levels/values/*@400k"
note = """
Arm datasets for the three-objective grid rerun wide, 400k levels each because
those arms are 3M steps rather than 1M. Same library, keyed by what the
objectives pay and how many levels there are, so the size is part of the key:
two datasets at the same values and different counts are not interchangeable,
since split membership is stored in the dataset itself.
"""

[[entry]]
match = "levels/values/1.00-0.55-0.40@1M"
note = "1M levels at the uneven three-objective values, for training threeobj.uneven.s1234."

[[entry]]
match = "retired/*"
note = """
The pre-migration layout, set aside by `scripts/migrate_volume.py --retire` on
2026-08-13 after every copy verified byte-identical (146/146). Nothing here is
referenced by anything; it exists so the rename is reversible by a human who has
looked at what is in it. Delete it once the analysis has run against the new
