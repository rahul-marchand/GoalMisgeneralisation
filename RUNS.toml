# Why each thing on the data volume exists.
#
# A run's configuration is already recoverable — every run writes its own
# cfg.json — so this file records only the part that is not: what question the
# run was launched to answer. Notes live here rather than only on the volume
# because the volume is rented and the repository is not.
#
# `scripts/manifest.py` reads this to generate MANIFEST.md, matching each entry
# against run and dataset paths relative to the data root. Patterns are glob
# style, most specific first: the first match wins, so a single run can override
# the group it belongs to.
#
# Add an entry when you launch something. `013 --note` and `001 --note` write the
# same text onto the volume at launch, and that copy is the fallback when
# nothing here matches.

[[entry]]
match = "runs/smoke5b"
note = """
5x5, 10M steps. The first thing trained at all: proof that our environment,
cleanba and JAX fit together end to end before spending GPU on 11x11. Not a
scientific configuration, and its probe numbers have little headroom — a linear
readout of the raw observation already reaches 0.871 on seven free cells.
"""

[[entry]]
match = "runs/maze11"
note = """
11x11, rho=1.0, fixed values, value channel present, 150M steps. The first real
agent. Colour perfectly predicts which objective is worth more, so the proxy is
available and the agent is free to take it.
"""

[[entry]]
match = "runs/clean11fv"
note = """
11x11, rho=0.5, fixed values, 150M steps. The single-variable control for
maze11: colour is uninformative, everything else identical, so the difference
between them is attributable to the correlation and nothing else.
"""

[[entry]]
match = "runs/clean11"
note = """
11x11, rho=0.5, values redrawn every episode, 130M steps. Randomised values give
a probe something to correlate against, which the fixed-value runs cannot: with
constants there is no per-episode value to regress on.
"""

[[entry]]
match = "runs/novalue11"
note = """
11x11, rho=1.0, no value channel at all — colour is the only cue to what an
objective is worth, so the values are learned constants rather than inputs. The
base agent for every value-axis experiment, and the reason those experiments
have to manufacture their own variance by fine-tuning: nothing varies within an
episode for a probe to read.
"""

[[entry]]
match = "runs/archive/*"
note = """
Early debugging runs from 2026-08-03, kept for provenance. Nothing downstream
reads them.
"""

[[entry]]
match = "valueaxis/runs/v050"
note = """
The null arm of the colour-1 sweep: fine-tuned onto the value it already had.
Whatever it moved is the cost of 585 updates rather than the value, and it is
the drift floor every other arm has to beat. It moved as far as any of them
(|delta| 14.41 against a mean of 14.74) and changed behaviour not at all — 7.7
extra steps, identical to the base.
"""

[[entry]]
match = "valueaxis/runs/v*"
note = """
Colour 1's value swept 0.3 to 0.9 with colour 0 held at 1.0, 3M steps each from
novalue11, identical in seed, rate and updates. Fits the value axis. Established
that an axis fitted without an arm reproduces that arm's behaviour, and that
norm-matched random directions do nothing.
"""

[[entry]]
match = "valueaxis/runs/c100"
note = "The null arm of the colour-0 sweep — same role as v050, at the other objective."

[[entry]]
match = "valueaxis/runs/c*"
note = """
Colour 0's value swept 0.6 to 1.2 with colour 1 held at 0.5, covering the same
gaps as the colour-1 sweep. Exists to separate a value from the gap between two
values: nothing behavioural can, since the choice turns on the difference alone,
so the test has to be made in the weights. Answer: cos(axis_0, axis_1) = -1.00,
one shared knob rather than two registers.
"""

[[entry]]
match = "threeobj/runs/base"
note = """
Three objectives worth (1.0, 0.65, 0.3), 11x11, no value channel, trained 80M
steps. Three objectives because with two the choice turns on a single difference
and a value slot and a threshold predict the same policy — which is exactly why
the two-objective grid could not decide between them.

The saved checkpoint is cp_70103040, not 80M: the inherited eval_at_steps jumps
from update 13,692 to 19,560 while the run stopped at 15,625, so the last 10M
steps were trained and discarded. Fixed afterwards by with_final_checkpoint;
every arm here resolves this same checkpoint, so the sweep is internally
consistent.

Swept around at 80M rather than trained further because performance on the
training distribution had flattened while the misgeneralisation gap was still
widening — more steps would have made it a more proxy-dependent agent, not a
better subject. See results/three-objective-gate.txt.
"""

[[entry]]
match = "threeobj/runs/m_*"
note = """
Two of the three values moved at once, 1M steps. Held out of every fit: these
are the composition test. If each objective's worth is held separately then
moving two is the sum of moving each, and an arm trained with both moved should
be reproduced by adding two axes neither of which saw it. Behaviourally it was —
matching exchange rate and choice quality, including a drop to 83.1% optimal
predicted at 83.0%.
"""

[[entry]]
match = "threeobj/runs/o*"
note = """
One objective's value moved at a time, offsets +/-0.1 and +/-0.2, 1M steps.
Fits one axis per objective. Symmetric offsets on purpose: with them balanced
around zero the common fine-tuning component cannot leak into the fitted axis,
which is what produced a confident-looking null in the first two-objective grid.
"""

[[entry]]
match = "threeobj2/runs/m_*"
note = """
The composition arms again at the wider offsets, plus one moving all three
values at once. Held out of every fit, as before.
"""

[[entry]]
match = "threeobj2/runs/*"
note = """
The three-objective grid rerun wide: same base agent, offsets doubled to +/-0.2
and +/-0.4, arms tripled to 3M steps. The first grid answered composition
behaviourally and said nothing about the weights — split-half reliability came
out at 0.04 to 0.09, so every cosine was attenuated past meaning and the
corrected ones fell outside the range a cosine can take. Signal grows with the
offset and noise does not.

Objective 2 sits at 0.3 and gets +/-0.1 and +/-0.25 rather than +/-0.4, since
four tenths below would make it a punishment — a different task rather than a
wider grid.
"""

[[entry]]
match = "levels11"
note = "The 1M-level dataset every 11x11 fixed-value agent trained on. Fingerprint d0e70f346ac4a46a."

[[entry]]
match = "levels11rv"
note = "As levels11, with values redrawn per level. Used by clean11."

[[entry]]
match = "archive/*"
note = "Datasets generated before the 2026-08-04 fix; they do not load against current code."

[[entry]]
match = "valueaxis/levels/*"
note = """
One dataset per point of the two-objective sweeps. Values are drawn at
generation and stored per level, so sweeping them needs one dataset each.
FixedValues consumes no randomness, so every dataset here shares its layouts and
differs only in what the objectives pay — verified: all eight layout arrays,
split membership included, are byte-identical across the grid.
"""

[[entry]]
match = "threeobj/levels/base"
note = "1M levels at (1.0, 0.65, 0.3), for training the three-objective base agent."

[[entry]]
match = "threeobj*/levels/*"
note = """
Arm datasets for the three-objective grids, 150k levels each. Far smaller than
the base dataset because the arms are far shorter runs: 1M steps is about 100k
episodes, so 140k training levels is already more than one apiece. Three
objectives cost 1.75 ms a level against 0.42 for two, so 500k-level arms would
have put nearly three hours of generation in front of the training run.
"""
